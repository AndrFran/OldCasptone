name: Terraform Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform*.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform*.yml"
  workflow_dispatch:

# Least privilege by default; jobs widen it only where needed.
permissions:
  contents: read

# One run per branch/PR — a new push cancels the previous CI run.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ---------------------------------------------------------------- CI stage
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids anonymous rate limits on plugin download
        run: |
          tflint --init
          tflint --format compact

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform init -backend=false
      - run: terraform validate -no-color

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform init -backend=false

      - name: terraform test
        run: terraform test -verbose

  # -------------------------------------------------------------- Plan stage
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [validate, test]
    permissions:
      contents: read
      pull-requests: write # to post the plan back onto the PR
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: terraform
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v7

      - name: Cache provider plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init

      - name: terraform plan
        run: |
          terraform plan -no-color \
            -var-file="envs/${{ matrix.environment }}.tfvars" \
            -out=tfplan | tee tfplan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt
          retention-days: 5

      - name: Job summary
        run: |
          {
            echo "### Terraform plan — \`${{ matrix.environment }}\`"
            echo '```hcl'
            tail -c 50000 tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true # fork PRs get a read-only token
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/tfplan.txt', 'utf8').slice(-50000);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `#### Terraform plan — \`${{ matrix.environment }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`,
            });

  # ------------------------------------------------- Deployment stage (dry run)
  # Each job targets a GitHub Environment. Required reviewers are configured in
  # repo Settings → Environments, which is what gates the manual approval.
  deploy-dev:
    name: Deploy
    needs: plan
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: dev

  deploy-staging:
    name: Deploy
    needs: deploy-dev
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: staging

  deploy-prod:
    name: Deploy
    needs: deploy-staging
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: prod
