version: 2

# Scheduled dependency updates. The security.yml workflow reports known
# vulnerabilities; this is what actually closes them.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    labels: [dependencies, infrastructure]
